<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mähroboter-Datenbank | Product Intelligence</title><meta name="description" content="20 verifizierte Mähroboter mit Fläche, Steigung, Navigation, Preisen und Herstellerquellen."><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f7f8fa;color:#111318}main{width:min(960px,calc(100% - 24px));margin:40px auto}.top{margin-bottom:30px}.top a{color:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:white;border:1px solid #e7e9ed;border-radius:20px;padding:18px;text-decoration:none;color:inherit}.brand{font-size:12px;color:#737986}.model{font-size:20px;font-weight:800;margin:3px 0 10px}.specs{display:flex;gap:7px;flex-wrap:wrap}.spec{background:#f2f4f6;border-radius:8px;padding:5px 7px;font-size:12px}.foot{color:#737986;font-size:12px;margin-top:12px}</style></head><body><main><div class="top"><a href="../">← Product Intelligence</a><h1>Mähroboter-Datenbank</h1><p>Strukturierte, quellenbasierte Produktdaten für erklärbare Kompatibilitätsentscheidungen.</p></div><div id="grid" class="grid"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('../data/products.json').then(r=>r.json()).then(ps=>{grid.innerHTML=ps.map(p=>`<a class="card" href="${esc(p.id)}/"><div class="brand">${esc(p.brand)}</div><div class="model">${esc(p.model)}</div><div class="specs"><span class="spec">${esc(p.max_area_m2)} m²</span><span class="spec">${esc(p.max_slope_pct)} %</span><span class="spec">${p.wire_free?'kabellos':'Kabel'}</span></div><div class="foot">${esc(p.navigation||'Navigation nicht angegeben')}</div></a>`).join('')})</script></body></html>
