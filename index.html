<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Compatibility Engine</title><meta name="description" content="Finde Produkte, die zu deinen realen Anforderungen passen. Erklärbare Kompatibilität statt generischer Bestenlisten."><style>body{font-family:system-ui;max-width:920px;margin:40px auto;padding:0 18px;line-height:1.5;background:#f7f8fa;color:#15202b}header,fieldset,.card{background:#fff;border:1px solid #dfe3e8;border-radius:14px;padding:18px;margin:14px 0}h1{margin-top:0}label{display:block;margin:12px 0}input{padding:9px}button{padding:10px 16px;border:0;border-radius:10px;cursor:pointer}.status{font-weight:800}.meta{color:#65707c;font-size:13px}.tag{display:inline-block;padding:3px 7px;border:1px solid #dfe3e8;border-radius:999px;margin-right:6px;font-size:12px}</style></head><body><header><span class="tag">MVP</span><span class="tag">Vertical #1: Mähroboter</span><h1>Welcher Mähroboter passt wirklich zu deinem Grundstück?</h1><p>Die Engine filtert nach harten Anforderungen. Affiliate-Provisionen beeinflussen das Ranking nicht.</p></header><fieldset><legend>Grundstücksprofil</legend><label>Rasenfläche (m²) <input id="area" type="number" value="700" min="1"></label><label>Maximale Steigung (%) <input id="slope" type="number" value="25" min="0"></label><label><input id="wf" type="checkbox" checked> Ohne Begrenzungskabel erforderlich</label><button id="run">Kompatibilität prüfen</button></fieldset><div id="out"></div><script>async function go(){const ps=await(await fetch('data/products.json')).json();const a=+area.value,s=+slope.value,w=wf.checked;const r=ps.map(p=>{const fails=[],passes=[];if(p.max_area_m2==null)fails.push('Flächenangabe unbekannt');else if(p.max_area_m2>=a)passes.push('Flächenkapazität ausreichend');else fails.push('nur bis '+p.max_area_m2+' m²');if(p.max_slope_pct==null)fails.push('Steigungsangabe unbekannt');else if(p.max_slope_pct>=s)passes.push('Steigung innerhalb Spezifikation');else fails.push('nur bis '+p.max_slope_pct+'% Steigung');if(w){if(p.wire_free===true)passes.push('kabellose Navigation');else if(p.wire_free===false)fails.push('Begrenzungskabel erforderlich');else fails.push('Kabellos-Status unbekannt')}return {...p,fails,passes,status:fails.length?'Nicht kompatibel':'Kompatibel'}}).sort((x,y)=>x.fails.length-y.fails.length||((y.max_area_m2||0)-(x.max_area_m2||0)));out.innerHTML='<h2>Ergebnis</h2>'+r.map(p=>`<section class="card"><div class="status">${p.status}: ${p.brand} ${p.model}</div><div>${p.navigation||'Navigation unbekannt'}</div><div>${p.passes.join(' · ')}</div>${p.fails.length?`<div><strong>Grund:</strong> ${p.fails.join(' · ')}</div>`:''}<div class="meta">Quelle: ${p.source_label||p.source}; geprüft: ${p.verified_at||'unbekannt'}</div></section>`).join('')}run.onclick=go;go();</script></body></html>
